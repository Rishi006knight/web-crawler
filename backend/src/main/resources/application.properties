spring.application.name=webcrawler

server.port=8080

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000

crawler.thread-pool-size=8
crawler.domain-delay-ms=500
crawler.per-domain-concurrency=2
crawler.page-cache-ttl-seconds=3600
crawler.job-ttl-days=7
crawler.allowed-schemes=http,https
crawler.request-timeout-ms=5000
crawler.max-retries=2

logging.level.com.ssn.webcrawler=INFO
