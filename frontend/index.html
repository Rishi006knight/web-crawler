<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/crawler-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Crawler — Structured Content & Site Inspector</title>
    <meta name="description" content="Premium web crawler platform with BFS crawling, SSRF protection, robots.txt compliance, and structured content extraction." />
    <link rel="canonical" href="https://web-crawler-ashy.vercel.app/" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFBF0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0C0A1A" />

    <script>
      (function() {
        try {
          var stored = localStorage.getItem('webcrawler-theme');
          var theme = stored ? stored : 'light';
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://web-crawler-ashy.vercel.app/" />
    <meta property="og:title" content="Web Crawler — Structured Content & Site Inspector" />
    <meta property="og:description" content="High-performance BFS crawler with robots.txt compliance, structured outline extraction, and link analysis." />
    <meta property="og:image" content="/crawler-icon.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://web-crawler-ashy.vercel.app/" />
    <meta name="twitter:title" content="Web Crawler — Structured Content & Site Inspector" />
    <meta name="twitter:description" content="High-performance BFS crawler with robots.txt compliance, structured outline extraction, and link analysis." />
    <meta name="twitter:image" content="/crawler-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>

    <div id="root"></div>

  </body>
</html>
